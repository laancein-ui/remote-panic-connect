<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panic Control | Remote Alarm</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
</head>
<body>
    <!-- Auth Overlay -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="glass-card">
            <h1>Panic Connect</h1>
            <p>Enter your credentials to link your devices.</p>
            <div id="auth-container">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="email@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 1rem;">
                    <button id="signInBtn" class="google-btn" style="background: var(--primary); color: white; margin-bottom: 0;">Sign In</button>
                    <button id="signUpBtn" class="secondary-btn">Sign Up</button>
                </div>
            </div>
            <p class="status-msg" id="authStatus" style="margin-top: 1rem; font-size: 0.8rem; color: #ff4d4d;"></p>
        </div>
    </div>

    <div id="main-content" class="container hidden">
        <div class="glass-card">
            <div class="header-actions">
                <button id="settingsBtn" class="icon-btn">⚙️</button>
                <button id="logoutBtn" class="icon-btn">Logout</button>
            </div>

            <h1>Panic Control</h1>
            
            <div class="input-group">
                <label>Device Identity</label>
                <input type="text" id="compName" placeholder="This Computer Name">
            </div>

            <div class="input-group">
                <label>Custom Message / Instruction</label>
                <textarea id="instruction" placeholder="e.g. Ring Alarm! or Call me now!"></textarea>
            </div>

            <button id="triggerBtn" class="trigger-btn">
                Trigger
            </button>

            <div class="status">
                <div id="statusDot" class="dot offline"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content glass-card">
                <h2>Settings</h2>
                <div class="setting-item">
                    <span>Account:</span>
                    <span id="userEmail" class="dim"></span>
                </div>
                <div class="setting-item">
                    <span>Active Room:</span>
                    <span id="roomId" class="dim"></span>
                </div>
                <button id="closeSettings" class="secondary-btn">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://neubyyonujujxegrkjly.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IcZLB0A5s3niBlim0SLWug_nODoReoI';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const socket = io();
        const authOverlay = document.getElementById('auth-overlay');
        const mainContent = document.getElementById('main-content');
        const triggerBtn = document.getElementById('triggerBtn');
        const compNameInput = document.getElementById('compName');
        const instructionInput = document.getElementById('instruction');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const authStatus = document.getElementById('authStatus');
        
        let currentUser = null;

        // Check Auth State
        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                setupSession(user);
            } else {
                authOverlay.classList.remove('hidden');
                mainContent.classList.add('hidden');
            }
        }

        function setupSession(user) {
            currentUser = user;
            authOverlay.classList.add('hidden');
            mainContent.classList.remove('hidden');
            document.getElementById('userEmail').innerText = user.email;
            document.getElementById('roomId').innerText = user.id.substring(0, 8) + '...';
            
            socket.emit('join_room', { room: user.id });
            
            localStorage.setItem('lastUser', user.email);
            compNameInput.value = localStorage.getItem('compName') || 'Computer ' + Math.floor(Math.random() * 100);
        }

        // Auth Listeners
        document.getElementById('signInBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('signInBtn');
            
            if (!email || !password) return alert('Please enter both email and password');
            
            btn.innerText = 'Signing In...';
            btn.disabled = true;
            authStatus.innerText = '';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    authStatus.innerText = "Error: " + error.message;
                    console.error(error);
                } else {
                    setupSession(data.user);
                }
            } catch (err) {
                authStatus.innerText = "Connection Error. Check your internet.";
                console.error(err);
            } finally {
                btn.innerText = 'Sign In';
                btn.disabled = false;
            }
        });

        document.getElementById('signUpBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('signUpBtn');

            if (!email || !password) return alert('Please enter both email and password');
            
            btn.innerText = 'Signing Up...';
            btn.disabled = true;
            authStatus.innerText = '';

            try {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    authStatus.innerText = "Error: " + error.message;
                } else if (data.user && data.session) {
                    setupSession(data.user);
                } else {
                    authStatus.innerText = "Success! Please check your email to confirm.";
                    authStatus.style.color = "#4ade80";
                }
            } catch (err) {
                authStatus.innerText = "Connection Error.";
            } finally {
                btn.innerText = 'Sign Up';
                btn.disabled = false;
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            location.reload();
        });

        // Socket Status
        socket.on('connect', () => {
            statusDot.classList.remove('offline');
            statusText.innerText = 'System Ready';
            if (currentUser) socket.emit('join_room', { room: currentUser.id });
        });

        socket.on('disconnect', () => {
            statusDot.classList.add('offline');
            statusText.innerText = 'Disconnected';
        });

        // Action
        triggerBtn.addEventListener('click', () => {
            if (!currentUser) return;
            
            const name = compNameInput.value || 'Anonymous Computer';
            const msg = instructionInput.value || 'ALARM_ACTIVATED';
            localStorage.setItem('compName', name);
            
            socket.emit('trigger_alarm', { 
                room: currentUser.id,
                timestamp: new Date().getTime(),
                computer_name: name,
                instruction: msg
            });
            
            triggerBtn.style.transform = 'scale(0.9)';
            setTimeout(() => triggerBtn.style.transform = 'scale(1)', 100);
        });

        // Modal Logic
        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('settings-modal').classList.remove('hidden');
        });
        document.getElementById('closeSettings').addEventListener('click', () => {
            document.getElementById('settings-modal').classList.add('hidden');
        });

        checkUser();
    </script>
</body>
</html>
